{% extends "base.html" %}
{% block title %}Log in — AccessWeave{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if form.errors %}
  <div class="alert error" role="alert">Your username and password didn't match. Please try again.</div>
{% endif %}
<form method="post" class="card" style="max-width:26rem">
  {% csrf_token %}
  <div class="field">
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
  </div>
  <div class="field">
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
  </div>
  <button class="btn big" type="submit">Log in</button>
  <p class="small muted" style="margin-top:1rem">Demo account: <strong>demo</strong> / <strong>accessweave</strong></p>
</form>
<p style="margin-top:1rem">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
{% endblock %}
